<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOSE 遊戲 - 完整測試報告</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
      color: #eee;
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 30px;
      background: linear-gradient(90deg, #7c5cfc, #e94560);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .test-card {
      background: rgba(22, 33, 62, 0.8);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }
    .test-card h3 {
      color: #7c5cfc;
      margin-bottom: 15px;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .test-item {
      margin: 8px 0;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      border-left: 3px solid #666;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-item.pass { border-left-color: #22bb33; }
    .test-item.fail { border-left-color: #bb2124; }
    .test-item.warn { border-left-color: #f0ad4e; }
    .status { font-weight: bold; }
    .status.pass { color: #22bb33; }
    .status.fail { color: #bb2124; }
    .status.warn { color: #f0ad4e; }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #7c5cfc, #6a4ad9);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(124, 92, 252, 0.3);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 92, 252, 0.5);
    }
    button:active { transform: translateY(0); }
    button.secondary {
      background: linear-gradient(135deg, #16213e, #0f0f1e);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .summary {
      background: linear-gradient(135deg, rgba(124, 92, 252, 0.2), rgba(233, 69, 96, 0.2));
      border: 2px solid #7c5cfc;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 30px;
      text-align: center;
    }
    .summary h2 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #7c5cfc;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }
    .summary-item {
      background: rgba(0, 0, 0, 0.3);
      padding: 15px;
      border-radius: 8px;
    }
    .summary-value {
      font-size: 32px;
      font-weight: bold;
      color: #7c5cfc;
      margin-top: 5px;
    }
    .summary-label {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
    }

    iframe {
      display: none;
    }

    .progress-bar {
      width: 100%;
      height: 30px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 15px;
      overflow: hidden;
      margin: 20px 0;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c5cfc, #e94560);
      transition: width 0.5s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }

    .log-section {
      background: rgba(15, 15, 30, 0.8);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
    }
    .log-section h3 {
      color: #7c5cfc;
      margin-bottom: 15px;
    }
    .log-entry {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 5px 10px;
      margin: 3px 0;
      border-left: 3px solid #444;
    }
    .log-entry.info { color: #5bc0de; border-left-color: #5bc0de; }
    .log-entry.success { color: #22bb33; border-left-color: #22bb33; }
    .log-entry.error { color: #bb2124; border-left-color: #bb2124; }
    .log-entry.warn { color: #f0ad4e; border-left-color: #f0ad4e; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 JOSE 遊戲 - 完整測試系統</h1>

    <div class="btn-group">
      <button onclick="runAllTests()">🚀 執行完整測試</button>
      <button onclick="runBattleTests()">⚔️ 戰鬥測試 (10次)</button>
      <button onclick="runUITests()">🎨 UI 測試</button>
      <button onclick="runDataTests()">📊 資料測試</button>
      <button class="secondary" onclick="clearResults()">🗑️ 清除結果</button>
      <button class="secondary" onclick="window.open('index.html', '_blank')">🎮 開啟遊戲</button>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress" style="width: 0%">準備中...</div>
    </div>

    <div class="summary" id="summary" style="display: none;">
      <h2>測試總結</h2>
      <div class="summary-grid">
        <div class="summary-item">
          <div class="summary-label">總測試數</div>
          <div class="summary-value" id="total-tests">0</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">通過</div>
          <div class="summary-value" style="color: #22bb33;" id="passed-tests">0</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">失敗</div>
          <div class="summary-value" style="color: #bb2124;" id="failed-tests">0</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">警告</div>
          <div class="summary-value" style="color: #f0ad4e;" id="warn-tests">0</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">成功率</div>
          <div class="summary-value" id="success-rate">0%</div>
        </div>
      </div>
    </div>

    <div class="test-grid" id="test-results"></div>

    <div class="log-section">
      <h3>📝 測試日誌</h3>
      <div id="test-log"></div>
    </div>
  </div>

  <iframe id="game-frame" src="index.html"></iframe>

  <script>
    let testResults = {
      total: 0,
      passed: 0,
      failed: 0,
      warnings: 0,
      categories: {}
    };

    function log(message, type = 'info') {
      const logEl = document.getElementById('test-log');
      const entry = document.createElement('div');
      entry.className = 'log-entry log-' + type;
      const timestamp = new Date().toLocaleTimeString();
      entry.textContent = '[' + timestamp + '] ' + message;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
      console.log(message);
    }

    function updateProgress(percent, text) {
      const progressEl = document.getElementById('progress');
      progressEl.style.width = percent + '%';
      progressEl.textContent = text || (percent + '%');
    }

    function addTestResult(category, name, status, message) {
      testResults.total++;
      if (status === 'pass') testResults.passed++;
      else if (status === 'fail') testResults.failed++;
      else if (status === 'warn') testResults.warnings++;

      if (!testResults.categories[category]) {
        testResults.categories[category] = [];
      }
      testResults.categories[category].push({ name, status, message });

      renderResults();
      updateSummary();
    }

    function renderResults() {
      const container = document.getElementById('test-results');
      container.innerHTML = '';

      for (const [category, tests] of Object.entries(testResults.categories)) {
        const card = document.createElement('div');
        card.className = 'test-card';

        const icon = category.includes('戰鬥') ? '⚔️' :
                     category.includes('UI') ? '🎨' :
                     category.includes('資料') ? '📊' :
                     category.includes('系統') ? '⚙️' : '✅';

        card.innerHTML = '<h3>' + icon + ' ' + category + '</h3>';

        tests.forEach(test => {
          const item = document.createElement('div');
          item.className = 'test-item ' + test.status;
          item.innerHTML =
            '<span>' + test.name + '</span>' +
            '<span class="status ' + test.status + '">' +
              (test.status === 'pass' ? '✓' : test.status === 'fail' ? '✗' : '⚠') +
            '</span>';
          if (test.message) {
            item.title = test.message;
          }
          card.appendChild(item);
        });

        container.appendChild(card);
      }
    }

    function updateSummary() {
      document.getElementById('summary').style.display = 'block';
      document.getElementById('total-tests').textContent = testResults.total;
      document.getElementById('passed-tests').textContent = testResults.passed;
      document.getElementById('failed-tests').textContent = testResults.failed;
      document.getElementById('warn-tests').textContent = testResults.warnings;

      const rate = testResults.total > 0
        ? Math.round((testResults.passed / testResults.total) * 100)
        : 0;
      document.getElementById('success-rate').textContent = rate + '%';

      const rateEl = document.getElementById('success-rate');
      if (rate >= 90) rateEl.style.color = '#22bb33';
      else if (rate >= 70) rateEl.style.color = '#f0ad4e';
      else rateEl.style.color = '#bb2124';
    }

    function clearResults() {
      testResults = { total: 0, passed: 0, failed: 0, warnings: 0, categories: {} };
      document.getElementById('test-results').innerHTML = '';
      document.getElementById('test-log').innerHTML = '';
      document.getElementById('summary').style.display = 'none';
      updateProgress(0, '準備中...');
      log('測試結果已清除', 'info');
    }

    async function runAllTests() {
      clearResults();
      log('========================================', 'info');
      log('開始執行完整測試套件', 'info');
      log('========================================', 'info');

      await runDataTests();
      await runUITests();
      await runBattleTests();

      log('========================================', 'success');
      log('所有測試完成！', 'success');
      log('========================================', 'success');
      updateProgress(100, '✅ 完成');
    }

    async function runDataTests() {
      log('開始資料完整性測試...', 'info');
      updateProgress(10, '資料測試...');

      const frame = document.getElementById('game-frame');
      await new Promise(resolve => setTimeout(resolve, 1000));

      try {
        const win = frame.contentWindow;

        // 測試寵物資料
        if (win.PET_DATA) {
          addTestResult('資料完整性', '寵物資料載入', 'pass', '共 ' + win.PET_DATA.length + ' 隻');
          log('✓ 寵物資料: ' + win.PET_DATA.length + ' 隻', 'success');

          const missingSkills = win.PET_DATA.filter(p => !p.skills || p.skills.length < 4);
          if (missingSkills.length === 0) {
            addTestResult('資料完整性', '寵物技能完整', 'pass', '所有寵物都有4個技能');
            log('✓ 所有寵物都有4個技能', 'success');
          } else {
            addTestResult('資料完整性', '寵物技能完整', 'fail', missingSkills.length + ' 隻寵物缺少技能');
            log('✗ ' + missingSkills.length + ' 隻寵物缺少技能', 'error');
          }

          // 檢查屬性分布
          const elements = { fire: 0, forest: 0, ocean: 0 };
          win.PET_DATA.forEach(p => elements[p.element]++);
          const balanced = elements.fire === 10 && elements.forest === 10 && elements.ocean === 10;
          addTestResult('資料完整性', '屬性平衡', balanced ? 'pass' : 'warn',
            'Fire:' + elements.fire + ' Forest:' + elements.forest + ' Ocean:' + elements.ocean);

        } else {
          addTestResult('資料完整性', '寵物資料載入', 'fail', '無法載入');
          log('✗ 無法載入寵物資料', 'error');
        }

        // 測試道具資料
        if (win.ITEM_DATA) {
          const itemCount = Object.keys(win.ITEM_DATA).length;
          addTestResult('資料完整性', '道具資料載入', 'pass', '共 ' + itemCount + ' 種道具');
          log('✓ 道具資料: ' + itemCount + ' 種', 'success');
        } else {
          addTestResult('資料完整性', '道具資料載入', 'fail', '無法載入');
        }

        // 測試關卡資料
        if (typeof win.getStageConfig === 'function') {
          const stage1 = win.getStageConfig(1);
          const stage10 = win.getStageConfig(10);
          const stage100 = win.getStageConfig(100);

          addTestResult('資料完整性', '關卡資料', 'pass', '100關資料完整');
          addTestResult('資料完整性', 'Boss設定', stage10.isBoss && stage100.isBoss ? 'pass' : 'fail',
            '第10關和第100關為Boss');
          log('✓ 關卡資料完整', 'success');
        } else {
          addTestResult('資料完整性', '關卡資料', 'fail', '無法載入');
        }

      } catch (e) {
        addTestResult('資料完整性', '測試執行', 'fail', e.message);
        log('✗ 資料測試錯誤: ' + e.message, 'error');
      }

      updateProgress(30, 'UI 測試...');
    }

    async function runUITests() {
      log('開始 UI 測試...', 'info');

      const frame = document.getElementById('game-frame');
      const win = frame.contentWindow;
      const doc = win.document;

      // 測試必要元素
      const requiredElements = [
        'game-container', 'hud', 'screen-battle', 'screen-inventory',
        'screen-gacha', 'screen-shop', 'screen-settings', 'bottom-nav'
      ];

      requiredElements.forEach(id => {
        const el = doc.getElementById(id);
        if (el) {
          addTestResult('UI 元素', id, 'pass', '元素存在');
        } else {
          addTestResult('UI 元素', id, 'fail', '元素不存在');
          log('✗ 元素不存在: ' + id, 'error');
        }
      });

      // 測試全域物件
      const modules = ['GameState', 'BattleEngine', 'BattleState', 'BattleStats',
                      'PetSystem', 'GachaSystem', 'ManualBattle', 'BattleView'];

      modules.forEach(name => {
        if (typeof win[name] !== 'undefined') {
          addTestResult('系統模組', name, 'pass', '模組已載入');
        } else {
          addTestResult('系統模組', name, 'fail', '模組未載入');
          log('✗ 模組未載入: ' + name, 'error');
        }
      });

      // 測試 GameState
      try {
        if (win.GameState) {
          const state = win.GameState.get();
          addTestResult('系統功能', 'GameState.get()', state ? 'pass' : 'fail', '狀態物件');

          if (state) {
            addTestResult('系統功能', '玩家等級', typeof state.playerLevel === 'number' ? 'pass' : 'fail');
            addTestResult('系統功能', '金幣系統', typeof state.gold === 'number' ? 'pass' : 'fail');
            addTestResult('系統功能', '鑽石系統', typeof state.diamond === 'number' ? 'pass' : 'fail');
            log('✓ GameState 運作正常', 'success');
          }
        }
      } catch (e) {
        addTestResult('系統功能', 'GameState', 'fail', e.message);
        log('✗ GameState 錯誤: ' + e.message, 'error');
      }

      updateProgress(50, '戰鬥測試...');
    }

    async function runBattleTests() {
      log('開始戰鬥測試 (10次)...', 'info');

      const frame = document.getElementById('game-frame');
      const win = frame.contentWindow;

      if (!win.GameState || !win.BattleEngine) {
        addTestResult('戰鬥測試', '初始化', 'fail', '遊戲模組未載入');
        return;
      }

      // 初始化遊戲
      try {
        win.GameState.init();
        const state = win.GameState.get();

        // 添加測試寵物
        if (state.pets.length === 0) {
          state.pets.push({ id: 'molten_ball', level: 10, exp: 0, stars: 2 });
          state.pets.push({ id: 'fire_lion', level: 10, exp: 0, stars: 2 });
          state.pets.push({ id: 'fire_fox', level: 10, exp: 0, stars: 2 });
          state.activePets = [0, 1, 2];
          win.GameState.save();
          log('✓ 添加測試寵物', 'info');
        }

        state.maxAp = 200;
        win.GameState.save();

        addTestResult('戰鬥測試', '初始化', 'pass', '遊戲初始化完成');

        // 執行10次戰鬥
        let wins = 0;
        let losses = 0;
        let errors = 0;

        for (let i = 1; i <= 10; i++) {
          updateProgress(50 + (i * 4), '戰鬥 ' + i + '/10...');

          try {
            state.currentStage = i;
            win.GameState.save();

            const result = win.BattleEngine.simulate(i, false);

            if (!result) {
              errors++;
              addTestResult('戰鬥測試', '第' + i + '關', 'fail', '結果為 null');
              log('✗ 第' + i + '關: 結果為 null', 'error');
            } else if (result.win) {
              wins++;
              addTestResult('戰鬥測試', '第' + i + '關', 'pass', '勝利');
              log('✓ 第' + i + '關: 勝利', 'success');
            } else {
              losses++;
              addTestResult('戰鬥測試', '第' + i + '關', 'warn', '失敗');
              log('⚠ 第' + i + '關: 失敗', 'warn');
            }

            await new Promise(resolve => setTimeout(resolve, 100));

          } catch (e) {
            errors++;
            addTestResult('戰鬥測試', '第' + i + '關', 'fail', e.message);
            log('✗ 第' + i + '關錯誤: ' + e.message, 'error');
          }
        }

        log('========================================', 'info');
        log('戰鬥測試總結:', 'info');
        log('  勝利: ' + wins + '/10', 'success');
        log('  失敗: ' + losses + '/10', losses > 0 ? 'warn' : 'info');
        log('  錯誤: ' + errors + '/10', errors > 0 ? 'error' : 'info');
        log('========================================', 'info');

        addTestResult('戰鬥測試', '總結', errors === 0 && wins >= 5 ? 'pass' : errors > 0 ? 'fail' : 'warn',
          '勝率: ' + (wins * 10) + '%');

      } catch (e) {
        addTestResult('戰鬥測試', '執行', 'fail', e.message);
        log('✗ 戰鬥測試錯誤: ' + e.message, 'error');
      }

      updateProgress(100, '✅ 完成');
    }

    // 頁面載入後初始化
    window.addEventListener('load', () => {
      log('🎮 測試系統就緒', 'info');
      log('選擇一個測試按鈕開始測試', 'info');
    });
  </script>
</body>
</html>
