<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOSE 遊戲測試</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: #eee; }
    .test-section { margin: 20px 0; padding: 15px; background: #16213e; border-radius: 8px; }
    .test-result { margin: 5px 0; padding: 8px; border-radius: 4px; }
    .pass { background: #22bb33; color: white; }
    .fail { background: #bb2124; color: white; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #7c5cfc; color: white; border: none; border-radius: 6px; }
    button:hover { background: #6a4ad9; }
    #game-frame { width: 100%; height: 600px; border: 2px solid #444; border-radius: 8px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>🎮 JOSE 遊戲自動測試</h1>

  <div class="test-section">
    <h2>功能測試</h2>
    <button onclick="runAllTests()">🚀 執行所有測試</button>
    <button onclick="openGame()">🎮 開啟遊戲</button>
    <div id="test-results"></div>
  </div>

  <div class="test-section">
    <h2>遊戲預覽</h2>
    <iframe id="game-frame" src="index.html"></iframe>
  </div>

  <script>
    let testResults = [];

    function logTest(name, passed, message) {
      testResults.push({ name, passed, message });
      updateDisplay();
    }

    function updateDisplay() {
      const container = document.getElementById('test-results');
      container.innerHTML = testResults.map(t =>
        `<div class="test-result ${t.passed ? 'pass' : 'fail'}">
          ${t.passed ? '✅' : '❌'} ${t.name}: ${t.message}
        </div>`
      ).join('');
    }

    function openGame() {
      window.open('index.html', '_blank');
    }

    async function runAllTests() {
      testResults = [];
      updateDisplay();

      console.log('🚀 開始測試...');

      // 測試 1: 檢查所有 JS 檔案是否存在
      const jsFiles = [
        'js/data/pets.js',
        'js/data/stages.js',
        'js/data/items.js',
        'js/core/GameState.js',
        'js/core/PetSystem.js',
        'js/core/BattleEngine.js',
        'js/core/BattleState.js',
        'js/core/BattleStats.js',
        'js/core/GachaSystem.js',
        'js/core/OfflineSystem.js',
        'js/ui/Navigation.js',
        'js/ui/BattleView.js',
        'js/ui/ManualBattle.js',
        'js/ui/InventoryView.js',
        'js/ui/GachaView.js',
        'js/ui/ShopView.js',
        'js/ui/SettingsView.js',
        'js/main.js'
      ];

      for (const file of jsFiles) {
        try {
          const response = await fetch(file);
          logTest('檔案存在', response.ok, file);
        } catch (e) {
          logTest('檔案存在', false, `${file} - ${e.message}`);
        }
      }

      // 測試 2: 檢查 CSS
      try {
        const response = await fetch('css/style.css');
        logTest('CSS 載入', response.ok, 'style.css');
      } catch (e) {
        logTest('CSS 載入', false, e.message);
      }

      // 測試 3: 檢查 index.html
      try {
        const response = await fetch('index.html');
        const html = await response.text();
        logTest('HTML 結構', html.includes('game-container'), 'game-container 存在');
        logTest('HUD 元素', html.includes('id="hud"'), 'HUD 存在');
        logTest('導航列', html.includes('bottom-nav'), '底部導航存在');
      } catch (e) {
        logTest('HTML 檢查', false, e.message);
      }

      // 測試 4: 載入遊戲並檢查全域物件
      const frame = document.getElementById('game-frame');
      setTimeout(() => {
        try {
          const win = frame.contentWindow;

          logTest('GameState', typeof win.GameState !== 'undefined', '全域物件存在');
          logTest('BattleEngine', typeof win.BattleEngine !== 'undefined', '全域物件存在');
          logTest('BattleState', typeof win.BattleState !== 'undefined', '全域物件存在');
          logTest('BattleStats', typeof win.BattleStats !== 'undefined', '全域物件存在');
          logTest('PetSystem', typeof win.PetSystem !== 'undefined', '全域物件存在');
          logTest('GachaSystem', typeof win.GachaSystem !== 'undefined', '全域物件存在');
          logTest('ManualBattle', typeof win.ManualBattle !== 'undefined', '全域物件存在');
          logTest('BattleView', typeof win.BattleView !== 'undefined', '全域物件存在');

          // 測試數據
          if (win.PET_DATA) {
            logTest('寵物資料', win.PET_DATA.length === 30, `共 ${win.PET_DATA.length} 隻寵物`);
          }

          if (win.ITEM_DATA) {
            logTest('道具資料', Object.keys(win.ITEM_DATA).length > 0, `共 ${Object.keys(win.ITEM_DATA).length} 種道具`);
          }

          // 測試 GameState
          if (win.GameState) {
            try {
              const state = win.GameState.get();
              logTest('GameState.get()', state !== null, '狀態物件存在');
              logTest('玩家等級', state.playerLevel >= 1, `Lv.${state.playerLevel}`);
              logTest('金幣系統', typeof state.gold === 'number', `${state.gold} 金幣`);
              logTest('鑽石系統', typeof state.diamond === 'number', `${state.diamond} 鑽石`);
            } catch (e) {
              logTest('GameState 測試', false, e.message);
            }
          }

        } catch (e) {
          logTest('iframe 存取', false, e.message);
        }
      }, 2000);

      console.log('✅ 測試完成');
    }

    // 自動執行測試
    window.addEventListener('load', () => {
      setTimeout(runAllTests, 1000);
    });
  </script>
</body>
</html>
