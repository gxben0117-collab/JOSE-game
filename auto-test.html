<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOSE 遊戲自動測試 - 10 次戰鬥模擬</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #1a1a2e;
      color: #eee;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 { color: #7c5cfc; }
    .test-section {
      margin: 20px 0;
      padding: 15px;
      background: #16213e;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .test-log {
      background: #0f0f1e;
      padding: 10px;
      border-radius: 6px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      margin-top: 10px;
    }
    .log-entry {
      margin: 3px 0;
      padding: 3px 6px;
      border-left: 3px solid #444;
    }
    .log-success { color: #22bb33; border-left-color: #22bb33; }
    .log-error { color: #bb2124; border-left-color: #bb2124; }
    .log-info { color: #5bc0de; border-left-color: #5bc0de; }
    .log-warning { color: #f0ad4e; border-left-color: #f0ad4e; }
    button {
      padding: 12px 24px;
      margin: 5px;
      cursor: pointer;
      background: #7c5cfc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
    }
    button:hover { background: #6a4ad9; }
    button:disabled { background: #555; cursor: not-allowed; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }
    .stat-card {
      background: #0f0f1e;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
    }
    .stat-label { color: #999; font-size: 12px; margin-bottom: 5px; }
    .stat-value { color: #7c5cfc; font-size: 24px; font-weight: bold; }
    .progress-bar {
      width: 100%;
      height: 24px;
      background: #0f0f1e;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c5cfc, #e94560);
      transition: width 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🎮 JOSE 遊戲自動測試系統</h1>

  <div class="test-section">
    <h2>控制面板</h2>
    <button id="btn-start" onclick="startTests()">🚀 開始 10 次戰鬥測試</button>
    <button onclick="clearLog()">🗑️ 清除日誌</button>
    <button onclick="location.reload()">🔄 重置</button>

    <div class="progress-bar">
      <div class="progress-fill" id="progress" style="width: 0%">0 / 10</div>
    </div>
  </div>

  <div class="test-section">
    <h2>測試統計</h2>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">完成測試</div>
        <div class="stat-value" id="stat-completed">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">成功次數</div>
        <div class="stat-value" id="stat-success">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">失敗次數</div>
        <div class="stat-value" id="stat-fail">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">錯誤次數</div>
        <div class="stat-value" id="stat-error">0</div>
      </div>
    </div>
  </div>

  <div class="test-section">
    <h2>測試日誌</h2>
    <div class="test-log" id="test-log"></div>
  </div>

  <!-- 嵌入遊戲 iframe -->
  <iframe id="game-frame" src="index.html" style="display:none"></iframe>

  <script>
    let testStats = {
      completed: 0,
      success: 0,
      fail: 0,
      error: 0
    };

    function log(message, type = 'info') {
      const logEl = document.getElementById('test-log');
      const entry = document.createElement('div');
      entry.className = 'log-entry log-' + type;
      entry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + message;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
      console.log(message);
    }

    function updateStats() {
      document.getElementById('stat-completed').textContent = testStats.completed;
      document.getElementById('stat-success').textContent = testStats.success;
      document.getElementById('stat-fail').textContent = testStats.fail;
      document.getElementById('stat-error').textContent = testStats.error;

      const progress = (testStats.completed / 10) * 100;
      const progressEl = document.getElementById('progress');
      progressEl.style.width = progress + '%';
      progressEl.textContent = testStats.completed + ' / 10';
    }

    function clearLog() {
      document.getElementById('test-log').innerHTML = '';
    }

    async function startTests() {
      const btn = document.getElementById('btn-start');
      btn.disabled = true;

      testStats = { completed: 0, success: 0, fail: 0, error: 0 };
      clearLog();
      updateStats();

      log('========================================', 'info');
      log('🎮 開始自動測試 - 10 次戰鬥模擬', 'info');
      log('========================================', 'info');

      // 等待遊戲載入
      const frame = document.getElementById('game-frame');
      await new Promise(resolve => setTimeout(resolve, 2000));

      const win = frame.contentWindow;

      // 檢查遊戲是否正確載入
      if (!win.GameState || !win.BattleEngine || !win.PET_DATA) {
        log('❌ 遊戲載入失敗！缺少必要模組', 'error');
        testStats.error++;
        updateStats();
        btn.disabled = false;
        return;
      }

      log('✅ 遊戲載入成功', 'success');

      // 初始化遊戲狀態
      try {
        win.GameState.init();
        const state = win.GameState.get();
        log('✅ GameState 初始化 - Lv.' + state.playerLevel, 'success');
      } catch (e) {
        log('❌ GameState 初始化失敗: ' + e.message, 'error');
        testStats.error++;
        updateStats();
        btn.disabled = false;
        return;
      }

      // 給玩家一些初始寵物
      try {
        const state = win.GameState.get();
        if (state.pets.length === 0) {
          // 添加 3 隻測試寵物
          state.pets.push({ id: 'molten_ball', level: 5, exp: 0, stars: 1 });
          state.pets.push({ id: 'fire_lion', level: 5, exp: 0, stars: 1 });
          state.pets.push({ id: 'fire_fox', level: 5, exp: 0, stars: 1 });
          state.activePets = [0, 1, 2];
          win.GameState.save();
          log('✅ 添加測試寵物 x3', 'success');
        }

        // 給足夠的 AP
        state.maxAp = 200;
        win.GameState.save();
        log('✅ 設定 AP: 200', 'success');
      } catch (e) {
        log('❌ 初始化寵物失敗: ' + e.message, 'error');
        testStats.error++;
        updateStats();
        btn.disabled = false;
        return;
      }

      // 執行 10 次戰鬥測試
      for (let i = 1; i <= 10; i++) {
        log('', 'info');
        log('─────────────────────────────────────', 'info');
        log('🎯 測試 #' + i + ' - 第 ' + i + ' 關', 'info');
        log('─────────────────────────────────────', 'info');

        try {
          const state = win.GameState.get();
          state.currentStage = i;
          win.GameState.save();

          // 執行自動戰鬥
          const result = win.BattleEngine.simulate(i, false);

          if (!result) {
            log('❌ 戰鬥結果為 null', 'error');
            testStats.error++;
          } else if (result.win) {
            log('✅ 戰鬥勝利！', 'success');
            log('  - 回合數: ' + result.log.filter(e => e.type === 'round').length, 'info');
            log('  - 獎勵: 金幣 +' + (result.rewards ? result.rewards.gold : 0), 'info');
            testStats.success++;
          } else {
            log('❌ 戰鬥失敗', 'warning');
            if (result.log && result.log.length > 0) {
              const lastMsg = result.log[result.log.length - 1];
              log('  - 原因: ' + (lastMsg.text || '全滅'), 'warning');
            }
            testStats.fail++;
          }

          testStats.completed++;
          updateStats();

          // 等待一下再進行下一次測試
          await new Promise(resolve => setTimeout(resolve, 500));

        } catch (e) {
          log('❌ 測試 #' + i + ' 發生錯誤: ' + e.message, 'error');
          log('  - Stack: ' + e.stack, 'error');
          testStats.error++;
          testStats.completed++;
          updateStats();
        }
      }

      log('', 'info');
      log('========================================', 'info');
      log('📊 測試完成！', 'info');
      log('  - 成功: ' + testStats.success + ' / 10', testStats.success === 10 ? 'success' : 'warning');
      log('  - 失敗: ' + testStats.fail + ' / 10', 'warning');
      log('  - 錯誤: ' + testStats.error + ' / 10', testStats.error > 0 ? 'error' : 'info');
      log('========================================', 'info');

      btn.disabled = false;
    }

    // 頁面載入後自動執行一次
    window.addEventListener('load', () => {
      log('🎮 測試系統就緒', 'info');
      log('點擊「開始 10 次戰鬥測試」按鈕開始自動測試', 'info');
    });
  </script>
</body>
</html>
