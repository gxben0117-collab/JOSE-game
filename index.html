<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10152d">
  <title>JOSE：幻獸遠征</title>
  <link rel="stylesheet" href="css/v2.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="brand" data-go="world"><span class="brand-mark">J</span><span><b>JOSE</b><small>幻獸遠征</small></span></button>
      <div class="resources">
        <span id="hud-level">Lv.1</span><span id="hud-gold">🪙 0</span><span id="hud-gems">💎 0</span><span id="hud-energy">⚡ 0/0</span>
      </div>
    </header>
    <main id="view" aria-live="polite"><div class="loading"><div class="orb"></div><p>喚醒幻獸世界…</p></div></main>
    <nav class="dock" aria-label="主要功能">
      <button data-go="world" class="active"><i>🗺️</i><span>冒險</span></button>
      <button data-go="pets"><i>🐾</i><span>幻獸</span></button>
      <button data-go="modes"><i>🏛️</i><span>試煉</span></button>
      <button data-go="summon"><i>✦</i><span>召喚</span></button>
      <button data-go="base"><i>🏕️</i><span>基地</span></button>
    </nav>
  </div>
  <div id="toast" role="status"></div>
  <div id="modal" class="modal" hidden></div>
  <script src="js/data/pets.js"></script>
  <script type="module" src="js/v2/app.js?v=4"></script>
</body>
</html>
